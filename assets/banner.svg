<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 360"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0b0f19"/><stop offset="50%" stop-color="#111827"/><stop offset="100%" stop-color="#090d16"/></linearGradient><linearGradient id="primaryGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="pillGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="rgba(99, 102, 241, 0.25)"/><stop offset="100%" stop-color="rgba(168, 85, 247, 0.15)"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="6"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><linearGradient id="lineGrad1" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8" stop-opacity=".2"/><stop offset="50%" stop-color="#818cf8" stop-opacity=".8"/><stop offset="100%" stop-color="#c084fc" stop-opacity=".2"/></linearGradient><style>@keyframes pulseNode{0%{transform:scale(1);opacity:.6}50%{transform:scale(1.3);opacity:1}}@keyframes flowDash{0%{stroke-dashoffset:200}}@keyframes floatPill{0%{transform:translateY(0)}50%{transform:translateY(-5px)}}.title-text{font-weight:800;font-size:42px;letter-spacing:-.5px}.badge-text,.subtitle-text,.title-text{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.subtitle-text{font-weight:500;font-size:16px;fill:#94a3b8;letter-spacing:.2px}.badge-text{font-weight:600;font-size:12px;fill:#e0e7ff}.node-circle{fill:#6366f1;opacity:.8}.animated-dash{stroke-dasharray:8 6;animation:flowDash 15s linear infinite}.pill-float-1{animation:floatPill 6s ease-in-out infinite}.pill-float-2{animation:floatPill 7s ease-in-out 1s infinite}.pill-float-3{animation:floatPill 5.5s ease-in-out 2s infinite}.pill-float-4{animation:floatPill 6.5s ease-in-out 1.5s infinite}</style></defs><rect width="1200" height="360" fill="url(#bgGrad)" rx="16"/><rect width="1198" height="358" x="1" y="1" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5" rx="15"/><g opacity=".45"><path fill="none" stroke="url(#lineGrad1)" stroke-width="2" d="M -50 80 Q 250 40 500 110 T 1000 60 T 1250 120" class="animated-dash"/><path fill="none" stroke="url(#lineGrad1)" stroke-width="2" d="M -50 280 Q 300 320 600 250 T 1100 290 T 1250 240" class="animated-dash" style="animation-direction:reverse"/><circle cx="280" cy="55" r="4" class="node-circle"/><circle cx="720" cy="85" r="5" class="node-circle"/><circle cx="1020" cy="65" r="4" class="node-circle"/><circle cx="180" cy="295" r="4" class="node-circle"/><circle cx="680" cy="265" r="5" class="node-circle"/><circle cx="950" cy="280" r="4" class="node-circle"/></g><g class="pill-float-1" transform="translate(60, 45)"><rect width="130" height="30" fill="url(#pillGrad)" stroke="rgba(129, 140, 248, 0.4)" stroke-width="1" rx="15"/><circle cx="16" cy="15" r="4" fill="#38bdf8"/><text x="30" y="20" class="badge-text">⚡ Real-Time Events</text></g><g class="pill-float-2" transform="translate(980, 45)"><rect width="150" height="30" fill="url(#pillGrad)" stroke="rgba(192, 132, 252, 0.4)" stroke-width="1" rx="15"/><circle cx="16" cy="15" r="4" fill="#c084fc"/><text x="30" y="20" class="badge-text">🔀 Journey Workflows</text></g><g class="pill-float-3" transform="translate(60, 285)"><rect width="165" height="30" fill="url(#pillGrad)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1" rx="15"/><circle cx="16" cy="15" r="4" fill="#34d399"/><text x="30" y="20" class="badge-text">📱 Omnichannel Delivery</text></g><g class="pill-float-4" transform="translate(970, 285)"><rect width="160" height="30" fill="url(#pillGrad)" stroke="rgba(244, 114, 182, 0.4)" stroke-width="1" rx="15"/><circle cx="16" cy="15" r="4" fill="#f472b6"/><text x="30" y="20" class="badge-text">